<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Deep Work Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #b026ff;
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Aesthetic Animated Background */
        .bg-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.15) 0%, rgba(176, 38, 255, 0.15) 40%, rgba(5, 5, 5, 1) 70%);
            transform: translate(-50%, -50%);
            animation: pulse 15s infinite alternate ease-in-out;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8) rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(1.2) rotate(360deg); }
        }

        /* Glassmorphism Container */
        .timer-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 90%;
            max-width: 500px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-card:hover {
            box-shadow: 0 30px 60px -12px rgba(0, 255, 204, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Time Display */
        .time-display {
            font-family: 'Space Mono', monospace;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 20px 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 204, 0.4);
            transition: color 0.3s;
        }

        .status-text {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* Inputs */
        .setup-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            width: 70px;
            text-align: center;
            padding: 10px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-start { background: rgba(0, 255, 204, 0.1); border-color: rgba(0, 255, 204, 0.3); color: var(--primary); }
        .btn-start:hover { background: rgba(0, 255, 204, 0.2); box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }
        
        .btn-pause { background: rgba(255, 170, 0, 0.1); border-color: rgba(255, 170, 0, 0.3); color: #ffaa00; }
        .btn-pause:hover { background: rgba(255, 170, 0, 0.2); box-shadow: 0 0 20px rgba(255, 170, 0, 0.4); }
        
        .btn-reset { background: rgba(255, 51, 102, 0.1); border-color: rgba(255, 51, 102, 0.3); color: #ff3366; }
        .btn-reset:hover { background: rgba(255, 51, 102, 0.2); box-shadow: 0 0 20px rgba(255, 51, 102, 0.4); }

        .btn-break { background: rgba(176, 38, 255, 0.1); border-color: rgba(176, 38, 255, 0.3); color: var(--secondary); width: 100%; margin-top: 10px;}
        .btn-break:hover { background: rgba(176, 38, 255, 0.2); box-shadow: 0 0 20px rgba(176, 38, 255, 0.4); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="timer-card">
        <div class="status-text" id="statusText">Focus Mode</div>
        
        <div class="time-display" id="timeDisplay">00:00:00</div>

        <div class="setup-section" id="setupSection">
            <div class="input-group">
                <label>Hours</label>
                <input type="number" id="inputHours" min="0" max="48" value="0">
            </div>
            <div class="input-group">
                <label>Mins</label>
                <input type="number" id="inputMins" min="0" max="59" value="25">
            </div>
            <div class="input-group">
                <label>Secs</label>
                <input type="number" id="inputSecs" min="0" max="59" value="0">
            </div>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn">Start</button>
            <button class="btn-pause hidden" id="pauseBtn">Pause</button>
            <button class="btn-reset" id="resetBtn">Reset</button>
            <button class="btn-break" id="breakBtn">Take a 5 Min Break</button>
        </div>
    </div>

    <script>
        let duration = 0;
        let timeLeft = 0;
        let timerInterval;
        let isRunning = false;
        let isBreak = false;

        const timeDisplay = document.getElementById('timeDisplay');
        const statusText = document.getElementById('statusText');
        const setupSection = document.getElementById('setupSection');
        
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const breakBtn = document.getElementById('breakBtn');

        const inputH = document.getElementById('inputHours');
        const inputM = document.getElementById('inputMins');
        const inputS = document.getElementById('inputSecs');

        // Check Local Storage on Load
        window.onload = () => {
            const savedState = JSON.parse(localStorage.getItem('aestheticTimer'));
            if (savedState) {
                isBreak = savedState.isBreak;
                if (savedState.isRunning) {
                    const now = Date.now();
                    timeLeft = Math.round((savedState.endTime - now) / 1000);
                    if (timeLeft > 0) {
                        startTimer(timeLeft, true);
                    } else {
                        resetTimer();
                    }
                } else if (savedState.timeLeft > 0) {
                    timeLeft = savedState.timeLeft;
                    updateDisplay(timeLeft);
                    showSetup(false);
                    startBtn.classList.remove('hidden');
                    pauseBtn.classList.add('hidden');
                    if(isBreak) statusText.innerText = "Break Time (Paused)";
                    else statusText.innerText = "Focus Mode (Paused)";
                }
            }
        };

        function saveState() {
            const state = {
                isRunning,
                timeLeft,
                endTime: isRunning ? Date.now() + (timeLeft * 1000) : null,
                isBreak
            };
            localStorage.setItem('aestheticTimer', JSON.stringify(state));
        }

        function updateDisplay(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            timeDisplay.innerText = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            document.title = `${timeDisplay.innerText} - ${isBreak ? 'Break' : 'Focus'}`;
        }

        function showSetup(show) {
            if (show) {
                setupSection.classList.remove('hidden');
                statusText.innerText = "Set Timer";
                timeDisplay.style.fontSize = "3rem"; 
            } else {
                setupSection.classList.add('hidden');
                statusText.innerText = isBreak ? "Break Time" : "Focus Mode";
                timeDisplay.style.fontSize = "5rem";
            }
        }

        function getSecondsFromInputs() {
            let h = parseInt(inputH.value) || 0;
            let m = parseInt(inputM.value) || 0;
            let s = parseInt(inputS.value) || 0;
            if (h > 48) h = 48; // Max 48 hours constraint
            return (h * 3600) + (m * 60) + s;
        }

        function startTimer(seconds, resume = false) {
            if (!resume) timeLeft = seconds;
            if (timeLeft <= 0) return;

            isRunning = true;
            showSetup(false);
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');

            saveState();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay(timeLeft);
                saveState();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    localStorage.removeItem('aestheticTimer');
                    statusText.innerText = "Time's Up!";
                    timeDisplay.innerText = "00:00:00";
                    startBtn.classList.remove('hidden');
                    pauseBtn.classList.add('hidden');
                    showSetup(true);
                    // Add aesthetic blink effect
                    let blinks = 0;
                    let blinkInt = setInterval(() => {
                        timeDisplay.style.opacity = timeDisplay.style.opacity == 0 ? 1 : 0;
                        blinks++;
                        if(blinks > 5) { clearInterval(blinkInt); timeDisplay.style.opacity = 1; }
                    }, 300);
                }
            }, 1000);
        }

        startBtn.addEventListener('click', () => {
            if (timeLeft === 0 || (!isRunning && setupSection.classList.contains('hidden') === false)) {
                isBreak = false;
                startTimer(getSecondsFromInputs());
            } else {
                startTimer(timeLeft, true); // Resume
            }
        });

        pauseBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            statusText.innerText += " (Paused)";
            saveState();
        });

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 0;
            updateDisplay(0);
            showSetup(true);
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            localStorage.removeItem('aestheticTimer');
            document.title = "Aesthetic Timer";
        }

        resetBtn.addEventListener('click', resetTimer);

        breakBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isBreak = true;
            startTimer(5 * 60); // 5 minutes break
        });

        // Limit inputs strictly
        inputH.addEventListener('input', () => { if(inputH.value > 48) inputH.value = 48; });
        inputM.addEventListener('input', () => { if(inputM.value > 59) inputM.value = 59; });
        inputS.addEventListener('input', () => { if(inputS.value > 59) inputS.value = 59; });

    </script>
</body>
</html>
