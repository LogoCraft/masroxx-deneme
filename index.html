<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        darker: '#0b1120',
                        glass: 'rgba(255, 255, 255, 0.05)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)',
                        /* Dynamic colors based on themes */
                        themeAccent: 'var(--accent-color)',
                        themeBreak: 'var(--break-color)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        /* Theme Configurations */
        :root {
            /* Default: Sakura */
            --bg-image: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=2076&auto=format&fit=crop');
            --accent-color: #ec4899; /* Pink */
            --accent-glow: rgba(236, 72, 153, 0.5);
            --break-color: #f43f5e;  /* Rose */
            --break-glow: rgba(244, 63, 94, 0.5);
            --overlay-color: rgba(15, 23, 42, 0.6);
        }

        body.theme-cars {
            --bg-image: url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=2070&auto=format&fit=crop');
            --accent-color: #38bdf8; /* Light Blue */
            --accent-glow: rgba(56, 189, 248, 0.5);
            --break-color: #818cf8;  /* Indigo */
            --break-glow: rgba(129, 140, 248, 0.5);
            --overlay-color: rgba(10, 15, 30, 0.7);
        }

        body.theme-forest {
            /* Daha belirgin ve etkileyici bir orman fotoğrafı */
            --bg-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=2070&auto=format&fit=crop');
            --accent-color: #10b981; /* Emerald */
            --accent-glow: rgba(16, 185, 129, 0.5);
            --break-color: #eab308;  /* Yellow */
            --break-glow: rgba(234, 179, 8, 0.5);
            --overlay-color: rgba(15, 25, 20, 0.75);
        }

        body.theme-custom {
            /* Kullanıcının yüklediği fotoğraf buraya gelecek */
            --bg-image: var(--user-bg-image, url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop'));
            --accent-color: #a855f7; /* Purple */
            --accent-glow: rgba(168, 85, 247, 0.5);
            --break-color: #f97316;  /* Orange */
            --break-glow: rgba(249, 115, 22, 0.5);
            --overlay-color: rgba(10, 10, 15, 0.8);
        }

        body {
            background-color: #0b1120;
            color: white;
            font-family: 'Inter', sans-serif;
            /* Allow scrolling now */
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
        }

        /* Dynamic Background Layer */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.8s ease-in-out;
        }

        /* Overlay for readability */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(to bottom, var(--overlay-color), rgba(11, 17, 32, 0.9));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.8s ease-in-out;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Progress Circle */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear, stroke 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            /* Stroke color controlled via JS based on mode */
        }

        /* Typography */
        .timer-text {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            /* Glow color controlled via JS */
            text-shadow: 0 0 25px var(--current-glow, var(--accent-glow));
            transition: text-shadow 0.5s ease;
        }

        /* Buttons */
        .btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn:active { transform: scale(0.92); }
        .btn:hover { box-shadow: 0 0 15px var(--current-glow, rgba(255,255,255,0.1)); }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        /* Inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Hidden class for modals */
        .fade-hidden {
            opacity: 0;
            pointer-events: none;
        }

        #settingsModal, #breakModal { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* Theme selector button active state */
        .theme-btn.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.1);
        }
    </style>
</head>
<body class="theme-sakura" id="bodyTheme">

    <!-- Backgrounds -->
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <!-- Theme Selector (Top Right) -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-20 flex space-x-3 glass-panel px-4 py-2 rounded-full animate-fade-in">
        <button class="theme-btn active w-8 h-8 rounded-full bg-pink-500/20 border-2 border-transparent text-pink-400 hover:scale-110 transition-all flex items-center justify-center" data-theme="theme-sakura" title="Tokyo Sakura">
            <i class="fas fa-fan"></i>
        </button>
        <button class="theme-btn w-8 h-8 rounded-full bg-blue-500/20 border-2 border-transparent text-blue-400 hover:scale-110 transition-all flex items-center justify-center" data-theme="theme-cars" title="Neon Cars">
            <i class="fas fa-car-side"></i>
        </button>
        <button class="theme-btn w-8 h-8 rounded-full bg-green-500/20 border-2 border-transparent text-green-400 hover:scale-110 transition-all flex items-center justify-center" data-theme="theme-forest" title="Mystic Forest">
            <i class="fas fa-tree"></i>
        </button>
        <div class="w-px h-6 bg-white/20 mx-1 self-center"></div> <!-- Ayırıcı Çizgi -->
        <button class="theme-btn w-8 h-8 rounded-full bg-purple-500/20 border-2 border-transparent text-purple-400 hover:scale-110 transition-all flex items-center justify-center" data-theme="theme-custom" title="Kendi Fotoğrafını Yükle">
            <i class="fas fa-image"></i>
        </button>
        <!-- Gizli dosya yükleme inputu -->
        <input type="file" id="bgInput" accept="image/*" class="hidden">
    </div>

    <div class="container mx-auto px-4 w-full relative z-10 flex flex-col items-center justify-center min-h-screen py-16">
        
        <!-- Status Indicator -->
        <div class="mb-8 flex items-center space-x-3 glass-panel px-6 py-2 rounded-full shadow-lg border border-glassBorder animate-fade-in" style="animation-delay: 0.1s;">
            <div id="statusDot" class="w-3 h-3 rounded-full bg-themeAccent animate-pulse" style="box-shadow: 0 0 10px var(--accent-glow);"></div>
            <span id="statusText" class="uppercase tracking-widest text-sm font-semibold text-themeAccent transition-colors">Focus Mode</span>
        </div>

        <!-- Main Timer Card -->
        <div class="glass-panel rounded-[2.5rem] p-8 sm:p-14 w-full max-w-lg relative flex flex-col items-center justify-center overflow-hidden animate-fade-in" style="animation-delay: 0.2s;">
            
            <!-- Circular Progress -->
            <div class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center mb-10 mt-4">
                <svg class="absolute top-0 left-0 w-full h-full drop-shadow-2xl" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"></circle>
                    <circle id="progressCircle" class="progress-ring__circle" cx="50" cy="50" r="46" fill="none" stroke="var(--accent-color)" stroke-width="4" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"></circle>
                </svg>

                <!-- Time Display -->
                <div class="absolute inset-0 flex flex-col items-center justify-center z-10">
                    <div id="timeDisplay" class="timer-text text-6xl sm:text-7xl font-bold text-white tracking-tighter" style="--current-glow: var(--accent-glow);">00:00</div>
                    <div id="hoursDisplay" class="timer-text text-2xl sm:text-3xl text-white mt-1 font-mono hidden opacity-80" style="--current-glow: var(--accent-glow);">00h</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center space-x-6 sm:space-x-8 w-full">
                <!-- Reset -->
                <button id="btnReset" class="btn w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white/5 border border-white/10 text-gray-300 hover:text-white hover:bg-white/10 flex items-center justify-center group" title="Reset Current Mode">
                    <i class="fas fa-rotate-left text-xl sm:text-2xl group-hover:-rotate-90 transition-transform duration-300"></i>
                </button>

                <!-- Play/Pause -->
                <button id="btnPlayPause" class="btn w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-themeAccent text-darker flex items-center justify-center transform transition hover:scale-105" style="box-shadow: 0 0 30px var(--accent-glow);">
                    <i id="playIcon" class="fas fa-play text-3xl sm:text-4xl ml-2"></i>
                    <i id="pauseIcon" class="fas fa-pause text-3xl sm:text-4xl hidden"></i>
                </button>

                <!-- Skip -->
                <button id="btnSkip" class="btn w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white/5 border border-white/10 text-gray-300 hover:text-white hover:bg-white/10 flex items-center justify-center group" title="Skip to Next Phase">
                    <i class="fas fa-forward text-xl sm:text-2xl group-hover:translate-x-1 transition-transform duration-300"></i>
                </button>
            </div>
        </div>

        <div class="mt-12 flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-lg animate-fade-in" style="animation-delay: 0.3s;">
            <button id="btnTakeBreak" class="btn w-full sm:w-auto flex-1 px-6 py-4 rounded-2xl bg-white/5 border border-white/10 text-gray-200 hover:text-white hover:border-themeBreak hover:bg-white/10 flex items-center justify-center space-x-3 text-base font-semibold">
                <i class="fas fa-mug-hot text-themeBreak"></i>
                <span>Take a Break</span>
            </button>
            <button id="btnSettings" class="btn w-full sm:w-auto flex-1 px-6 py-4 rounded-2xl bg-white/5 border border-white/10 text-gray-200 hover:text-white hover:border-themeAccent hover:bg-white/10 flex items-center justify-center space-x-3 text-base font-semibold">
                <i class="fas fa-sliders-h text-themeAccent"></i>
                <span>Custom Timer</span>
            </button>
        </div>
        
        <!-- Info text showing when session resumes -->
        <div id="resumeInfo" class="mt-8 text-sm sm:text-base text-gray-300 font-mono opacity-0 transition-opacity duration-300 bg-black/30 px-6 py-2 rounded-full border border-white/5">
            <!-- Will be populated via JS -->
        </div>

    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md fade-hidden overflow-y-auto">
        <div class="modal-content glass-panel w-full max-w-md rounded-[2rem] p-6 sm:p-8 transform scale-95 border border-glassBorder relative my-8">
            
            <button id="btnCloseSettings" class="absolute top-6 right-6 text-gray-400 hover:text-white transition-colors bg-white/5 rounded-full w-8 h-8 flex items-center justify-center">
                <i class="fas fa-times"></i>
            </button>

            <h2 class="text-2xl font-bold mb-8 text-white tracking-wide flex items-center"><i class="fas fa-clock mr-3 text-themeAccent"></i> Set Timers</h2>

            <div class="space-y-8">
                <!-- Focus Time Input -->
                <div class="space-y-3 bg-black/20 p-4 rounded-2xl border border-white/5">
                    <label class="block text-sm font-semibold text-themeAccent uppercase tracking-wider">Focus Duration (Max 48h)</label>
                    <div class="flex space-x-3">
                        <div class="relative w-1/2">
                            <input type="number" id="inputHours" min="0" max="48" value="0" class="w-full bg-black/40 border border-white/10 rounded-xl py-4 px-4 text-white text-center text-xl font-mono focus:outline-none focus:border-themeAccent focus:ring-1 focus:ring-themeAccent transition-all">
                            <span class="absolute top-1/2 -translate-y-1/2 right-4 text-sm text-gray-400">hrs</span>
                        </div>
                        <div class="relative w-1/2">
                            <input type="number" id="inputMinutes" min="0" max="59" value="25" class="w-full bg-black/40 border border-white/10 rounded-xl py-4 px-4 text-white text-center text-xl font-mono focus:outline-none focus:border-themeAccent focus:ring-1 focus:ring-themeAccent transition-all">
                            <span class="absolute top-1/2 -translate-y-1/2 right-4 text-sm text-gray-400">mins</span>
                        </div>
                    </div>
                </div>

                <!-- Default Break Input -->
                <div class="space-y-3 bg-black/20 p-4 rounded-2xl border border-white/5">
                    <label class="block text-sm font-semibold text-themeBreak uppercase tracking-wider">Default Break</label>
                    <div class="flex space-x-3">
                        <div class="relative w-1/2">
                            <input type="number" id="inputBreakHours" min="0" max="24" value="0" class="w-full bg-black/40 border border-white/10 rounded-xl py-4 px-4 text-white text-center text-xl font-mono focus:outline-none focus:border-themeBreak focus:ring-1 focus:ring-themeBreak transition-all">
                            <span class="absolute top-1/2 -translate-y-1/2 right-4 text-sm text-gray-400">hrs</span>
                        </div>
                        <div class="relative w-1/2">
                            <input type="number" id="inputBreakMinutes" min="0" max="59" value="5" class="w-full bg-black/40 border border-white/10 rounded-xl py-4 px-4 text-white text-center text-xl font-mono focus:outline-none focus:border-themeBreak focus:ring-1 focus:ring-themeBreak transition-all">
                            <span class="absolute top-1/2 -translate-y-1/2 right-4 text-sm text-gray-400">mins</span>
                        </div>
                    </div>
                </div>

                <button id="btnSaveSettings" class="w-full py-4 mt-4 rounded-xl bg-themeAccent text-darker font-bold text-lg hover:brightness-110 transition-all transform hover:-translate-y-1" style="box-shadow: 0 10px 20px var(--accent-glow);">
                    Start Custom Timer
                </button>
            </div>
        </div>
    </div>
    
    <!-- Break Modal -->
    <div id="breakModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md fade-hidden overflow-y-auto">
        <div class="modal-content glass-panel w-full max-w-md rounded-[2rem] p-6 sm:p-8 transform scale-95 border border-glassBorder relative my-8">
            
            <button id="btnCloseBreak" class="absolute top-6 right-6 text-gray-400 hover:text-white transition-colors bg-white/5 rounded-full w-8 h-8 flex items-center justify-center">
                <i class="fas fa-times"></i>
            </button>

            <h2 class="text-2xl font-bold mb-2 text-white tracking-wide flex items-center"><i class="fas fa-leaf mr-3 text-themeBreak"></i> Take a Break</h2>
            <p class="text-gray-300 text-sm mb-6 leading-relaxed">Choose a break time. When finished, your focus session will resume <strong class="text-white">exactly</strong> where you left off.</p>

            <div class="grid grid-cols-3 gap-3 mb-8">
                <!-- Preset Buttons -->
                <button class="quick-break-btn btn bg-black/30 border border-white/5 hover:border-themeBreak hover:bg-white/10 rounded-2xl py-4 text-center transition-all group" data-mins="5">
                    <span class="block text-2xl font-bold text-white group-hover:text-themeBreak">5</span>
                    <span class="text-xs text-gray-400 uppercase tracking-wider">min</span>
                </button>
                <button class="quick-break-btn btn bg-black/30 border border-white/5 hover:border-themeBreak hover:bg-white/10 rounded-2xl py-4 text-center transition-all group" data-mins="10">
                    <span class="block text-2xl font-bold text-white group-hover:text-themeBreak">10</span>
                    <span class="text-xs text-gray-400 uppercase tracking-wider">min</span>
                </button>
                <button class="quick-break-btn btn bg-black/30 border border-white/5 hover:border-themeBreak hover:bg-white/10 rounded-2xl py-4 text-center transition-all group" data-mins="15">
                    <span class="block text-2xl font-bold text-white group-hover:text-themeBreak">15</span>
                    <span class="text-xs text-gray-400 uppercase tracking-wider">min</span>
                </button>
                <button class="quick-break-btn btn bg-black/30 border border-white/5 hover:border-themeBreak hover:bg-white/10 rounded-2xl py-4 text-center transition-all group" data-mins="20">
                    <span class="block text-2xl font-bold text-white group-hover:text-themeBreak">20</span>
                    <span class="text-xs text-gray-400 uppercase tracking-wider">min</span>
                </button>
                <button class="quick-break-btn btn bg-black/30 border border-white/5 hover:border-themeBreak hover:bg-white/10 rounded-2xl py-4 text-center transition-all group" data-mins="30">
                    <span class="block text-2xl font-bold text-white group-hover:text-themeBreak">30</span>
                    <span class="text-xs text-gray-400 uppercase tracking-wider">min</span>
                </button>
                <button class="quick-break-btn btn bg-black/30 border border-white/5 hover:border-themeBreak hover:bg-white/10 rounded-2xl py-4 text-center transition-all group" data-mins="60">
                    <span class="block text-2xl font-bold text-white group-hover:text-themeBreak">60</span>
                    <span class="text-xs text-gray-400 uppercase tracking-wider">min</span>
                </button>
            </div>
            
            <div class="bg-black/20 p-4 rounded-2xl border border-white/5 space-y-3">
                <label class="block text-sm font-semibold text-themeBreak uppercase tracking-wider">Custom Break</label>
                <div class="flex space-x-2">
                    <input type="number" id="customBreakHrs" placeholder="Hrs" min="0" class="w-1/3 bg-black/40 border border-white/10 rounded-xl py-3 px-2 text-white text-center focus:outline-none focus:border-themeBreak transition-all">
                    <input type="number" id="customBreakMins" placeholder="Mins" min="0" class="w-1/3 bg-black/40 border border-white/10 rounded-xl py-3 px-2 text-white text-center focus:outline-none focus:border-themeBreak transition-all">
                    <button id="btnStartCustomBreak" class="w-1/3 btn bg-themeBreak text-darker font-bold rounded-xl hover:brightness-110 transition-all">
                        Start
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const bodyTheme = document.getElementById('bodyTheme');
        const timeDisplay = document.getElementById('timeDisplay');
        const hoursDisplay = document.getElementById('hoursDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const btnReset = document.getElementById('btnReset');
        const btnSkip = document.getElementById('btnSkip');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const resumeInfo = document.getElementById('resumeInfo');
        const themeBtns = document.querySelectorAll('.theme-btn');
        
        // Modals
        const settingsModal = document.getElementById('settingsModal');
        const btnSettings = document.getElementById('btnSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const btnSaveSettings = document.getElementById('btnSaveSettings');
        
        const breakModal = document.getElementById('breakModal');
        const btnTakeBreak = document.getElementById('btnTakeBreak');
        const btnCloseBreak = document.getElementById('btnCloseBreak');
        const quickBreakBtns = document.querySelectorAll('.quick-break-btn');
        const btnStartCustomBreak = document.getElementById('btnStartCustomBreak');
        
        // Custom Image Upload Input
        const bgInput = document.getElementById('bgInput');

        // Circle Math
        const radius = progressCircle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = circumference;

        // Constants
        const MODES = { FOCUS: 'focus', BREAK: 'break' };
        const STORAGE_KEY = 'epic_timer_v2_state';

        // State object
        let state = {
            theme: 'theme-sakura',
            customBg: null, // Kullanıcının yüklediği fotoğrafı bellekte tutmak için
            mode: MODES.FOCUS,
            isRunning: false,
            
            focusTotalTime: 25 * 60,
            focusTimeLeft: 25 * 60,
            
            breakTotalTime: 5 * 60,
            breakTimeLeft: 5 * 60,
            
            lastTickTime: null
        };

        let timerInterval = null;

        // Load & Save State
        function loadState() {
            const savedState = localStorage.getItem(STORAGE_KEY);
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    
                    // Offline progress calculation
                    if (parsed.isRunning && parsed.lastTickTime) {
                        const now = Date.now();
                        const elapsedSeconds = Math.floor((now - parsed.lastTickTime) / 1000);
                        
                        if (parsed.mode === MODES.FOCUS) {
                            parsed.focusTimeLeft = Math.max(0, parsed.focusTimeLeft - elapsedSeconds);
                            if (parsed.focusTimeLeft === 0) parsed.isRunning = false;
                        } else {
                            parsed.breakTimeLeft = Math.max(0, parsed.breakTimeLeft - elapsedSeconds);
                            if (parsed.breakTimeLeft === 0) {
                                parsed.mode = MODES.FOCUS;
                                parsed.isRunning = false;
                            }
                        }
                    }
                    parsed.lastTickTime = parsed.isRunning ? Date.now() : null;
                    state = { ...state, ...parsed };
                } catch (e) {
                    console.error("State load error", e);
                }
            }
            applyTheme(state.theme);
            updateUI();
            if (state.isRunning) startTimerLoop();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function applyTheme(themeName) {
            // Eğer "Custom" seçildiyse ve fotoğraf yoksa, fotoğraf seçme penceresini aç
            if (themeName === 'theme-custom' && !state.customBg) {
                bgInput.click();
                return;
            }

            state.theme = themeName;
            bodyTheme.className = themeName; // Replaces classes safely
            
            // Eğer "Custom" aktifse CSS arka plan değişkenini kullanıcının fotoğrafı yap
            if (themeName === 'theme-custom' && state.customBg) {
                document.documentElement.style.setProperty('--user-bg-image', `url(${state.customBg})`);
            }
            
            // Update active button state
            themeBtns.forEach(btn => {
                if(btn.dataset.theme === themeName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Force UI update to refresh colors
            updateUI();
            saveState();
        }

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Eğer zaten "Custom" temasındaysa ve butona tekrar basarsa yeni fotoğraf yüklet
                if (btn.dataset.theme === 'theme-custom' && state.theme === 'theme-custom') {
                    bgInput.click();
                    return;
                }
                applyTheme(btn.dataset.theme);
            });
        });

        // Kullanıcı kendi fotoğrafını seçtiğinde onu optimize et ve kaydet
        bgInput.addEventListener('change', (e) => {
            if(e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // Tarayıcı hafızasını(localStorage) doldurmamak için görseli yeniden boyutlandırıp sıkıştırıyoruz
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1920; // Maksimum genişlik 1080p
                        let scaleSize = 1;
                        if (img.width > MAX_WIDTH) {
                            scaleSize = MAX_WIDTH / img.width;
                        }
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // %60 kaliteyle JPEG'e çevir (Veriyi küçük tutmak için)
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6); 
                        state.customBg = compressedDataUrl;
                        
                        // Fotoğraf yüklendiği an temayı uygula
                        applyTheme('theme-custom');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
                
                // Aynı fotoğrafı tekrar seçebilmek için input'u temizle
                e.target.value = '';
            }
        });

        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            const pad = (num) => num.toString().padStart(2, '0');
            
            return {
                hasHours: h > 0,
                hoursStr: `${pad(h)}h`,
                minSecStr: `${pad(m)}:${pad(s)}`
            };
        }

        function updateProgress(timeLeft, totalTime) {
            if (totalTime === 0) return;
            const percent = (timeLeft / totalTime);
            const offset = circumference - (percent * circumference);
            progressCircle.style.strokeDashoffset = offset;
        }

        function updateUI() {
            const isFocus = state.mode === MODES.FOCUS;
            const currentTotal = isFocus ? state.focusTotalTime : state.breakTotalTime;
            const currentLeft = isFocus ? state.focusTimeLeft : state.breakTimeLeft;

            // Update Time
            const timeFmt = formatTime(currentLeft);
            timeDisplay.textContent = timeFmt.minSecStr;
            
            if (timeFmt.hasHours) {
                hoursDisplay.textContent = timeFmt.hoursStr;
                hoursDisplay.classList.remove('hidden');
            } else {
                hoursDisplay.classList.add('hidden');
            }
            
            document.title = `${timeFmt.hasHours ? timeFmt.hoursStr + ' ' : ''}${timeFmt.minSecStr} - ${isFocus ? 'Focus' : 'Break'}`;

            // Update Circle
            updateProgress(currentLeft, currentTotal);

            // Update Play/Pause Button
            if (state.isRunning) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }

            // Mode Colors & Text
            if (isFocus) {
                statusText.textContent = "Focus Mode";
                statusText.style.color = 'var(--accent-color)';
                statusDot.style.backgroundColor = 'var(--accent-color)';
                statusDot.style.boxShadow = '0 0 10px var(--accent-glow)';
                
                progressCircle.setAttribute('stroke', 'var(--accent-color)');
                timeDisplay.style.setProperty('--current-glow', 'var(--accent-glow)');
                hoursDisplay.style.setProperty('--current-glow', 'var(--accent-glow)');
                
                btnPlayPause.style.backgroundColor = 'var(--accent-color)';
                btnPlayPause.style.boxShadow = '0 0 30px var(--accent-glow)';
                
                btnTakeBreak.classList.remove('hidden');
                btnSettings.classList.remove('hidden');
                resumeInfo.style.opacity = '0';
            } else {
                statusText.textContent = "Break Time";
                statusText.style.color = 'var(--break-color)';
                statusDot.style.backgroundColor = 'var(--break-color)';
                statusDot.style.boxShadow = '0 0 10px var(--break-glow)';
                
                progressCircle.setAttribute('stroke', 'var(--break-color)');
                timeDisplay.style.setProperty('--current-glow', 'var(--break-glow)');
                hoursDisplay.style.setProperty('--current-glow', 'var(--break-glow)');
                
                btnPlayPause.style.backgroundColor = 'var(--break-color)';
                btnPlayPause.style.boxShadow = '0 0 30px var(--break-glow)';
                
                btnTakeBreak.classList.add('hidden');
                btnSettings.classList.add('hidden'); // Hide settings during break
                
                if(state.focusTimeLeft > 0) {
                    const fmtFocus = formatTime(state.focusTimeLeft);
                    resumeInfo.innerHTML = `Focus resumes from <strong class="text-white">${fmtFocus.hasHours ? fmtFocus.hoursStr + ' ' : ''}${fmtFocus.minSecStr}</strong>`;
                    resumeInfo.style.opacity = '1';
                }
            }
        }

        function playAlarm() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        function timerTick() {
            if (!state.isRunning) return;

            const now = Date.now();
            const deltaMs = now - (state.lastTickTime || now);
            
            if (deltaMs >= 1000) {
                const elapsedSeconds = Math.floor(deltaMs / 1000);
                state.lastTickTime = now - (deltaMs % 1000);

                if (state.mode === MODES.FOCUS) {
                    state.focusTimeLeft = Math.max(0, state.focusTimeLeft - elapsedSeconds);
                    if (state.focusTimeLeft === 0) {
                        state.isRunning = false;
                        playAlarm();
                        switchMode(MODES.BREAK);
                    }
                } else {
                    state.breakTimeLeft = Math.max(0, state.breakTimeLeft - elapsedSeconds);
                    if (state.breakTimeLeft === 0) {
                        state.isRunning = false;
                        playAlarm();
                        // Resume from where left off logic:
                        if (state.focusTimeLeft <= 0) {
                            state.focusTimeLeft = state.focusTotalTime;
                        }
                        switchMode(MODES.FOCUS);
                        togglePlayPause(); // auto resume focus
                    }
                }
                updateUI();
                saveState();
            }
        }

        function startTimerLoop() {
            if (timerInterval) clearInterval(timerInterval);
            state.lastTickTime = Date.now();
            timerInterval = setInterval(timerTick, 200);
        }

        function togglePlayPause() {
            state.isRunning = !state.isRunning;
            if (state.isRunning) {
                if (state.mode === MODES.FOCUS && state.focusTimeLeft <= 0) state.focusTimeLeft = state.focusTotalTime;
                if (state.mode === MODES.BREAK && state.breakTimeLeft <= 0) state.breakTimeLeft = state.breakTotalTime;
                startTimerLoop();
            } else {
                clearInterval(timerInterval);
                state.lastTickTime = null;
            }
            updateUI();
            saveState();
        }

        function resetTimer() {
            state.isRunning = false;
            clearInterval(timerInterval);
            state.lastTickTime = null;
            
            if (state.mode === MODES.FOCUS) {
                state.focusTimeLeft = state.focusTotalTime;
            } else {
                state.breakTimeLeft = state.breakTotalTime;
            }
            updateUI();
            saveState();
        }

        function switchMode(newMode) {
            state.mode = newMode;
            state.isRunning = false;
            clearInterval(timerInterval);
            state.lastTickTime = null;
            
            if(newMode === MODES.BREAK) {
                state.breakTimeLeft = state.breakTotalTime;
            }
            // If newMode is FOCUS, we explicitly DO NOT reset focusTimeLeft 
            // so it continues exactly from where it paused.
            
            updateUI();
            saveState();
        }

        // Button Events
        btnPlayPause.addEventListener('click', togglePlayPause);
        btnReset.addEventListener('click', resetTimer);
        btnSkip.addEventListener('click', () => {
            if (state.mode === MODES.FOCUS) switchMode(MODES.BREAK);
            else switchMode(MODES.FOCUS);
        });

        function openModal(modalEl) {
            modalEl.classList.remove('fade-hidden');
            setTimeout(() => {
                modalEl.style.opacity = '1';
                modalEl.querySelector('.modal-content').style.transform = 'scale(1)';
            }, 10);
        }

        function closeModal(modalEl) {
            modalEl.style.opacity = '0';
            modalEl.querySelector('.modal-content').style.transform = 'scale(0.95)';
            setTimeout(() => modalEl.classList.add('fade-hidden'), 300);
        }

        // Settings
        btnSettings.addEventListener('click', () => {
            document.getElementById('inputHours').value = Math.floor(state.focusTotalTime / 3600);
            document.getElementById('inputMinutes').value = Math.floor((state.focusTotalTime % 3600) / 60);
            document.getElementById('inputBreakHours').value = Math.floor(state.breakTotalTime / 3600);
            document.getElementById('inputBreakMinutes').value = Math.floor((state.breakTotalTime % 3600) / 60);
            openModal(settingsModal);
        });
        
        btnCloseSettings.addEventListener('click', () => closeModal(settingsModal));
        
        btnSaveSettings.addEventListener('click', () => {
            const fh = parseInt(document.getElementById('inputHours').value) || 0;
            const fm = parseInt(document.getElementById('inputMinutes').value) || 0;
            const bh = parseInt(document.getElementById('inputBreakHours').value) || 0;
            const bm = parseInt(document.getElementById('inputBreakMinutes').value) || 0;

            let totalFocusSecs = (fh * 3600) + (fm * 60);
            if (totalFocusSecs > 48 * 3600) totalFocusSecs = 48 * 3600;
            if (totalFocusSecs === 0) totalFocusSecs = 60;

            let totalBreakSecs = (bh * 3600) + (bm * 60);
            if (totalBreakSecs === 0) totalBreakSecs = 60;

            state.focusTotalTime = totalFocusSecs;
            state.focusTimeLeft = totalFocusSecs;
            state.breakTotalTime = totalBreakSecs;
            state.breakTimeLeft = totalBreakSecs;
            
            state.mode = MODES.FOCUS;
            state.isRunning = false;
            clearInterval(timerInterval);
            
            updateUI();
            saveState();
            closeModal(settingsModal);
        });

        // Breaks
        btnTakeBreak.addEventListener('click', () => {
            document.getElementById('customBreakHrs').value = '';
            document.getElementById('customBreakMins').value = '';
            openModal(breakModal);
        });
        btnCloseBreak.addEventListener('click', () => closeModal(breakModal));

        function startBreak(totalSeconds) {
            state.isRunning = false;
            clearInterval(timerInterval);
            
            state.breakTotalTime = totalSeconds;
            state.breakTimeLeft = totalSeconds;
            
            closeModal(breakModal);
            switchMode(MODES.BREAK);
            togglePlayPause();
        }

        quickBreakBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                startBreak(parseInt(btn.dataset.mins) * 60);
            });
        });

        btnStartCustomBreak.addEventListener('click', () => {
            const h = parseInt(document.getElementById('customBreakHrs').value) || 0;
            const m = parseInt(document.getElementById('customBreakMins').value) || 0;
            const totalSecs = (h * 3600) + (m * 60);
            if (totalSecs > 0) startBreak(totalSecs);
        });

        // Backdrop Clicks
        [settingsModal, breakModal].forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal(modal);
            });
        });

        // Background Tab handling
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && state.isRunning) timerTick();
        });

        // Init
        loadState();
    </script>
</body>
</html>
